# fly.toml — RippleDrop Fly.io configuration
# Deploy with: fly deploy
# First-time setup: fly launch --no-deploy  (then fly deploy)
#
# Region: sin (Singapore) — closest to India for low-latency signaling.
# This server only relays WebRTC signaling text; no file bytes pass through it.

app            = "rippledrop"
primary_region = "sin"

[build]
  # Uses Fly's built-in Node.js buildpack — no Dockerfile needed.
  # If you add a Dockerfile it will be used automatically instead.

[env]
  NODE_ENV = "production"
  PORT     = "3000"

# ── HTTP service ───────────────────────────────────────────
[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

  # WebSocket keep-alive — Socket.io needs long-lived connections
  [http_service.concurrency]
    type       = "connections"
    hard_limit = 500
    soft_limit = 400

# ── Machine size ───────────────────────────────────────────
# Signaling only — shared CPU + 256 MB RAM is more than enough.
[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1

# ── Health check ──────────────────────────────────────────
[[http_service.checks]]
  grace_period = "5s"
  interval     = "15s"
  method       = "GET"
  path         = "/"
  timeout      = "5s"